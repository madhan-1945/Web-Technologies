<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile</title>

<!-- React CDN -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<!-- Babel for JSX -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>

/* Page styling */
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background-color:#f4f6f8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Profile container */
.profile-card{
    background:white;
    padding:30px;
    width:320px;
    border-radius:8px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    text-align:center;
}

/* Heading */
.profile-title{
    margin-bottom:20px;
    color:#2c3e50;
}

/* Details section */
.profile-details{
    text-align:left;
}

/* Each row */
.detail{
    margin:10px 0;
    font-size:16px;
}

/* Label style */
.label{
    font-weight:bold;
    color:#34495e;
}

</style>

</head>

<body>

<div id="root"></div>

<script type="text/babel">

/* Student Profile Component */
function StudentProfile(){

    // Student details stored in variables
    const name = "J Madhan Kumaar";
    const department = "Computer Science (AI & ML)";
    const year = "3rd Year";
    const section = "A";

    return(

        <div className="profile-card">

            <h2 className="profile-title">
                Student Profile
            </h2>

            <div className="profile-details">

                <p className="detail">
                    <span className="label">Name:</span> {name}
                </p>

                <p className="detail">
                    <span className="label">Department:</span> {department}
                </p>

                <p className="detail">
                    <span className="label">Year:</span> {year}
                </p>

                <p className="detail">
                    <span className="label">Section:</span> {section}
                </p>

            </div>

        </div>

    );
}

/* Root component */
function App(){
    return <StudentProfile />;
}

/* Render React component */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>

</body>
</html>
