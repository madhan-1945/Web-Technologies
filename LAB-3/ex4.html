<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --primary: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* Form Styling */
        .registration-card {
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
            border: 1px solid var(--border);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group { display: flex; flex-direction: column; }
        
        label { font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; color: #475569; }

        input {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            transition: border 0.3s;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        .btn-group { margin-top: 20px; display: flex; gap: 10px; }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-primary:hover { opacity: 0.9; }

        /* Table Styling */
        .table-container {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }

        th { background: #f1f5f9; padding: 15px; color: #64748b; font-size: 0.85rem; text-transform: uppercase; }

        td { padding: 15px; border-top: 1px solid var(--border); font-size: 0.95rem; }

        tr:hover { background-color: #f8fafc; }

        .delete-btn { color: var(--danger); background: transparent; padding: 5px 10px; border: 1px solid var(--danger); border-radius: 4px; }
        .delete-btn:hover { background: var(--danger); color: white; }

        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="registration-card">
        <h2 style="margin-top:0">User Registration</h2>
        <form id="regForm">
            <div class="form-grid">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="input-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="10 digits" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Min 6 characters" required>
                </div>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn-primary">Register User</button>
            </div>
        </form>
    </div>

    <div class="header-flex">
        <h2 style="margin:0">Registered Users</h2>
        <button onclick="clearAll()" class="btn-danger">Clear All Users</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    const regForm = document.getElementById('regForm');
    const tableBody = document.getElementById('userTableBody');

    // Load users on startup
    document.addEventListener('DOMContentLoaded', displayUsers);

    regForm.addEventListener('submit', (e) => {
        e.preventDefault();

        // 1. Get Values
        const user = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            mobile: document.getElementById('mobile').value,
            password: document.getElementById('password').value
        };

        // 2. Validations
        if (user.mobile.length !== 10 || isNaN(user.mobile)) {
            alert("Mobile number must be exactly 10 digits.");
            return;
        }

        if (user.password.length < 6) {
            alert("Password must be at least 6 characters.");
            return;
        }

        // 3. LocalStorage Logic
        let users = JSON.parse(localStorage.getItem('users')) || [];

        // Duplicate Email check
        if (users.find(u => u.email === user.email)) {
            alert("This email is already registered!");
            return;
        }

        users.push(user);
        localStorage.setItem('users', JSON.stringify(users));
        
        regForm.reset();
        displayUsers();
        alert("User Registered Successfully!");
    });

    function displayUsers() {
        const users = JSON.parse(localStorage.getItem('users')) || [];
        tableBody.innerHTML = '';

        users.forEach((user, index) => {
            const row = `
                <tr>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.mobile}</td>
                    <td>
                        <button class="delete-btn" onclick="deleteUser(${index})">Delete</button>
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    function deleteUser(index) {
        if (confirm("Are you sure you want to delete this user?")) {
            let users = JSON.parse(localStorage.getItem('users'));
            users.splice(index, 1);
            localStorage.setItem('users', JSON.stringify(users));
            displayUsers();
        }
    }

    function clearAll() {
        if (confirm("Warning: This will delete ALL registered users. Continue?")) {
            localStorage.removeItem('users');
            displayUsers();
        }
    }
</script>

</body>
</html>
