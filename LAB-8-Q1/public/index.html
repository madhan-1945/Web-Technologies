<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Notes Manager</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
    h1 { color: #333; text-align: center; }
    .form-box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, textarea { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; margin: 4px; }
    .btn-add { background: #4CAF50; color: white; width: 100%; padding: 10px; }
    .btn-edit { background: #2196F3; color: white; }
    .btn-delete { background: #f44336; color: white; }
    .btn-save { background: #4CAF50; color: white; }
    .btn-cancel { background: #gray; color: white; background: #9E9E9E; }
    .note-card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .note-card h3 { margin: 0 0 5px 0; color: #333; }
    .note-card p { margin: 4px 0; color: #666; }
    .note-card .subject { color: #2196F3; font-weight: bold; }
  </style>
</head>
<body>

  <h1>📚 Student Notes Manager</h1>

  <!-- Add Note Form -->
  <div class="form-box">
    <h2>Add New Note</h2>
    <input type="text" id="title" placeholder="Title" />
    <input type="text" id="subject" placeholder="Subject" />
    <textarea id="description" rows="3" placeholder="Description"></textarea>
    <button class="btn-add" onclick="addNote()">Add Note</button>
  </div>

  <!-- Notes List -->
  <h2>All Notes</h2>
  <div id="notes-list"></div>

  <script>
    // Load notes when page opens
    window.onload = loadNotes;

    // VIEW all notes
    async function loadNotes() {
      const res = await fetch('/notes');
      const notes = await res.json();
      const list = document.getElementById('notes-list');
      list.innerHTML = '';
      notes.forEach(note => {
        list.innerHTML += `
          <div class="note-card" id="card-${note._id}">
            <h3>${note.title}</h3>
            <p class="subject">📖 ${note.subject}</p>
            <p>${note.description}</p>
            <p><small>📅 ${new Date(note.created_date).toLocaleDateString()}</small></p>
            <button class="btn-edit" onclick="editNote('${note._id}', '${note.title}', '${note.subject}', '${note.description}')">Edit</button>
            <button class="btn-delete" onclick="deleteNote('${note._id}')">Delete</button>
          </div>`;
      });
    }

    // ADD note
    async function addNote() {
      const title = document.getElementById('title').value;
      const subject = document.getElementById('subject').value;
      const description = document.getElementById('description').value;
      if (!title || !subject || !description) { alert('Please fill all fields!'); return; }
      await fetch('/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, subject, description })
      });
      document.getElementById('title').value = '';
      document.getElementById('subject').value = '';
      document.getElementById('description').value = '';
      loadNotes();
    }

    // EDIT note - shows inline edit form
    function editNote(id, title, subject, description) {
      document.getElementById(`card-${id}`).innerHTML = `
        <input type="text" id="edit-title-${id}" value="${title}" />
        <input type="text" id="edit-subject-${id}" value="${subject}" />
        <textarea id="edit-desc-${id}" rows="3">${description}</textarea>
        <button class="btn-save" onclick="saveNote('${id}')">Save</button>
        <button class="btn-cancel" onclick="loadNotes()">Cancel</button>`;
    }

    // SAVE updated note
    async function saveNote(id) {
      const title = document.getElementById(`edit-title-${id}`).value;
      const subject = document.getElementById(`edit-subject-${id}`).value;
      const description = document.getElementById(`edit-desc-${id}`).value;
      await fetch(`/notes/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, subject, description })
      });
      loadNotes();
    }

    // DELETE note
    async function deleteNote(id) {
      if (confirm('Are you sure you want to delete this note?')) {
        await fetch(`/notes/${id}`, { method: 'DELETE' });
        loadNotes();
      }
    }
  </script>

</body>
</html>
