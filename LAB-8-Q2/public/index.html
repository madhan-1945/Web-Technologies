<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Book Finder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 20px; }
    h1 { text-align: center; color: #333; margin-bottom: 20px; }
    .controls { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-wrap: wrap; gap: 10px; }
    input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; flex: 1; min-width: 200px; }
    button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn-search { background: #2196F3; color: white; }
    .btn-filter { background: #9C27B0; color: white; }
    .btn-sort { background: #FF9800; color: white; }
    .btn-top { background: #F44336; color: white; }
    .btn-load { background: #4CAF50; color: white; display: block; margin: 20px auto; padding: 12px 30px; }
    select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    .book-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .book-card h3 { color: #333; margin-bottom: 8px; }
    .book-card p { color: #666; font-size: 14px; margin: 4px 0; }
    .rating { color: #FF9800; font-weight: bold; }
    .price { color: #4CAF50; font-weight: bold; font-size: 16px; }
    .category { background: #e3f2fd; color: #1976D2; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
    .status { text-align: center; color: #666; padding: 20px; }
    .page-info { text-align: center; color: #666; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>📚 Online Book Finder</h1>

  <!-- Controls -->
  <div class="controls">
    <!-- Search -->
    <input type="text" id="search-input" placeholder="🔍 Search by title..." />
    <button class="btn-search" onclick="searchBooks()">Search</button>

    <!-- Filter by Category -->
    <select id="category-select">
      <option value="">All Categories</option>
      <option value="Programming">Programming</option>
      <option value="Database">Database</option>
      <option value="Design">Design</option>
      <option value="AI">AI</option>
      <option value="Computer Science">Computer Science</option>
    </select>
    <button class="btn-filter" onclick="filterByCategory()">Filter</button>

    <!-- Sort -->
    <button class="btn-sort" onclick="sortBooks('price')">Sort by Price ↑</button>
    <button class="btn-sort" onclick="sortBooks('rating')">Sort by Rating ↓</button>

    <!-- Top Rated -->
    <button class="btn-top" onclick="topRated()">⭐ Top Rated</button>

    <!-- All Books -->
    <button onclick="loadPage(1)" style="background:#607D8B;color:white;">Show All</button>
  </div>

  <!-- Status -->
  <p class="status" id="status">Showing all books</p>

  <!-- Books Grid -->
  <div class="books-grid" id="books-grid"></div>

  <!-- Pagination -->
  <div id="pagination"></div>

  <script>
    let currentPage = 1;

    // Load books on page open
    window.onload = () => loadPage(1);

    // Render book cards
    function renderBooks(books) {
      const grid = document.getElementById('books-grid');
      if (books.length === 0) {
        grid.innerHTML = '<p class="status">No books found!</p>';
        return;
      }
      grid.innerHTML = books.map(book => `
        <div class="book-card">
          <h3>${book.title}</h3>
          <p>✍️ ${book.author}</p>
          <p><span class="category">${book.category}</span></p>
          <p class="rating">⭐ ${book.rating} / 5</p>
          <p class="price">₹ ${book.price}</p>
          <p>📅 ${book.year}</p>
        </div>
      `).join('');
    }

    // 1. SEARCH by title
    async function searchBooks() {
      const title = document.getElementById('search-input').value;
      if (!title) { loadPage(1); return; }
      const res = await fetch(`/books/search?title=${title}`);
      const books = await res.json();
      renderBooks(books);
      document.getElementById('status').textContent = `Search results for "${title}" — ${books.length} found`;
      document.getElementById('pagination').innerHTML = '';
    }

    // 2. FILTER by category
    async function filterByCategory() {
      const category = document.getElementById('category-select').value;
      if (!category) { loadPage(1); return; }
      const res = await fetch(`/books/category/${category}`);
      const books = await res.json();
      renderBooks(books);
      document.getElementById('status').textContent = `Category: ${category} — ${books.length} books found`;
      document.getElementById('pagination').innerHTML = '';
    }

    // 3. SORT by price or rating
    async function sortBooks(field) {
      const res = await fetch(`/books/sort/${field}`);
      const books = await res.json();
      renderBooks(books);
      document.getElementById('status').textContent = `Sorted by ${field}`;
      document.getElementById('pagination').innerHTML = '';
    }

    // 4. TOP RATED books
    async function topRated() {
      const res = await fetch('/books/top');
      const books = await res.json();
      renderBooks(books);
      document.getElementById('status').textContent = `Top Rated Books (Rating ≥ 4)`;
      document.getElementById('pagination').innerHTML = '';
    }

    // 5. PAGINATION
    async function loadPage(page) {
      currentPage = page;
      const res = await fetch(`/books?page=${page}`);
      const data = await res.json();
      renderBooks(data.books);
      document.getElementById('status').textContent = `Showing page ${page} of ${data.totalPages}`;

      // Pagination buttons
      let paginationHTML = '';
      if (page > 1) paginationHTML += `<button class="btn-load" onclick="loadPage(${page - 1})">← Previous</button>`;
      if (page < data.totalPages) paginationHTML += `<button class="btn-load" onclick="loadPage(${page + 1})">Load More →</button>`;
      document.getElementById('pagination').innerHTML = paginationHTML;
    }
  </script>

</body>
</html>
